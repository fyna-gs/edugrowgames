<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU GROW GAME</title>
    
    <!-- Tailwind CSS (Untuk Desain & Warna) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Untuk Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Engine Aplikasi) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Penerjemah Kode untuk Browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-pattern {
            background-image: radial-gradient(circle at 4px 4px, white 4px, transparent 0);
            background-size: 48px 48px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- UTILITY EFEK SUARA ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'select') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'complete') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'square';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
                        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.15 + 0.05);
                        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.15 + 0.15);
                        osc.start(ctx.currentTime + i * 0.15);
                        osc.stop(ctx.currentTime + i * 0.15 + 0.15);
                    });
                }
            } catch (e) {
                console.log('Audio play failed:', e);
            }
        };

        // --- DATABASE SIMULASI ---
        const initialData = {
            teachers: [{ id: 't1', email: 'guru@edugame.id', password: 'password', name: 'Bapak Budi' }],
            games: [
                {
                    id: 'g1', teacherId: 't1', title: 'Berpetualangan Matematika Dasar', subject: 'Matematika', grade: 'SD Kelas 3', code: 'MATH123',
                    questions: [
                        { id: 'q1', type: 'mcq', text: 'Berapakah 15 + 27?', options: ['32', '42', '52', '45'], correctAnswer: '42', points: 10 },
                        { id: 'q2', type: 'mcq', text: '5 x 8 = ?', options: ['35', '40', '45', '50'], correctAnswer: '40', points: 10 }
                    ]
                }
            ],
            results: []
        };

        // --- KOMPONEN UTAMA ---
        function EduGameApp() {
            const [view, setView] = useState('landing');
            const [db, setDb] = useState(initialData);
            const [currentUser, setCurrentUser] = useState(null);
            const [activeGame, setActiveGame] = useState(null);
            const [activeStudent, setActiveStudent] = useState(null);
            const [toast, setToast] = useState('');

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 3000);
            };

            const handleRegister = (name, email, password) => {
                if (!name || !email || !password) return showToast('Harap lengkapi semua data pendaftaran!');
                if (db.teachers.find(t => t.email === email)) return showToast('Email tersebut sudah terdaftar!');
                const newTeacher = { id: `t${Date.now()}`, name, email, password };
                setDb(prev => ({ ...prev, teachers: [...prev.teachers, newTeacher] }));
                setCurrentUser(newTeacher);
                setView('teacher-dash');
                showToast('Pendaftaran berhasil! Selamat datang.');
            };

            const handleLogin = (email, password) => {
                const teacher = db.teachers.find(t => t.email === email && t.password === password);
                if (teacher) {
                    setCurrentUser(teacher);
                    setView('teacher-dash');
                    showToast('Login berhasil!');
                } else {
                    showToast('Email atau password salah!');
                }
            };

            const handleCreateGame = (newGame) => {
                const gameData = {
                    ...newGame,
                    id: `g${Date.now()}`,
                    teacherId: currentUser.id,
                    code: Math.random().toString(36).substring(2, 8).toUpperCase()
                };
                setDb(prev => ({ ...prev, games: [...prev.games, gameData] }));
                setView('teacher-dash');
                showToast('Game berhasil dibuat!');
            };

            const handleStudentJoin = (code, name, grade, mode) => {
                const game = db.games.find(g => g.code.toUpperCase() === code.toUpperCase());
                if (game) {
                    setActiveGame({ ...game, playMode: mode });
                    setActiveStudent({ id: `s${Date.now()}`, name, grade });
                    setView('play');
                } else {
                    showToast('Kode permainan tidak ditemukan!');
                }
            };

            const handleFinishGame = (studentAnswers) => {
                let totalCorrect = 0, totalPoints = 0, maxPoints = 0;
                activeGame.questions.forEach(q => {
                    maxPoints += q.points;
                    if (studentAnswers[q.id] === q.correctAnswer) {
                        totalCorrect += 1;
                        totalPoints += q.points;
                    }
                });

                const finalScore = maxPoints > 0 ? Math.round((totalPoints / maxPoints) * 100) : 0;
                const resultRecord = {
                    id: `r${Date.now()}`,
                    gameId: activeGame.id,
                    teacherId: activeGame.teacherId,
                    studentName: activeStudent.name,
                    studentClass: activeStudent.grade,
                    score: finalScore,
                    totalCorrect,
                    totalQuestions: activeGame.questions.length,
                    answers: studentAnswers,
                    timestamp: new Date().toISOString()
                };

                setDb(prev => ({ ...prev, results: [...prev.results, resultRecord] }));
                setView('student-complete');
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800">
                    {toast && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 animate-bounce">
                            <i className="fa-solid fa-circle-check text-green-400"></i>
                            <span className="font-medium">{toast}</span>
                        </div>
                    )}
                    
                    {view === 'landing' && <LandingPage setView={setView} />}
                    {view === 'login' && <TeacherLogin onLogin={handleLogin} setView={setView} />}
                    {view === 'register' && <TeacherRegister onRegister={handleRegister} setView={setView} />}
                    {view === 'teacher-dash' && <TeacherDashboard db={db} user={currentUser} setView={setView} setActiveGame={setActiveGame} />}
                    {view === 'create-game' && <CreateGame onSave={handleCreateGame} setView={setView} showToast={showToast} />}
                    {view === 'student-join' && <StudentJoin onJoin={handleStudentJoin} setView={setView} />}
                    {view === 'play' && <StudentPlay game={activeGame} student={activeStudent} onFinish={handleFinishGame} />}
                    {view === 'student-complete' && <StudentComplete setView={setView} gameMode={activeGame?.playMode} />}
                    {view === 'teacher-results' && <TeacherResults db={db} game={activeGame} user={currentUser} setView={setView} showToast={showToast} />}
                </div>
            );
        }

        // ==========================================
        // VIEW COMPONENTS
        // ==========================================

        function LandingPage({ setView }) {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-900 via-indigo-900 to-purple-900 p-6 text-white relative overflow-hidden">
                    <div className="absolute top-1/4 left-10 text-yellow-300 opacity-60 animate-[bounce_4s_infinite] text-6xl"><i className="fa-solid fa-star"></i></div>
                    <div className="absolute bottom-20 left-1/4 text-green-400 opacity-50 animate-[pulse_5s_infinite] text-6xl"><i className="fa-solid fa-leaf"></i></div>
                    <div className="absolute top-20 right-20 text-cyan-300 opacity-60 animate-[bounce_5s_infinite] text-6xl" style={{animationDelay: '1s'}}><i className="fa-solid fa-earth-americas"></i></div>
                    
                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] max-w-[800px] max-h-[800px] bg-cyan-500/20 rounded-full blur-[100px] pointer-events-none"></div>

                    <div className="z-10 text-center max-w-3xl w-full">
                        <div className="flex justify-center mb-4">
                            <div className="bg-cyan-500/30 backdrop-blur-md p-6 rounded-[2rem] shadow-[0_0_30px_rgba(6,182,212,0.5)] border-4 border-cyan-300 rotate-3 hover:rotate-0 transition-transform cursor-pointer">
                                <i className="fa-solid fa-compass text-6xl text-cyan-200 drop-shadow-md"></i>
                            </div>
                        </div>
                        
                        <h1 className="text-6xl md:text-8xl font-black mb-0 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-400 to-orange-500 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] filter">
                            EDU GAMES
                        </h1>
                        <h2 className="text-xl md:text-3xl font-black mb-10 text-cyan-300 drop-shadow-xl inline-block bg-blue-900/50 px-8 py-2 rounded-full border-2 border-cyan-400/50 mt-4">
                            BELAJAR SAMBIL BERPETUALANGAN!
                        </h2>
                        
                        <div className="grid md:grid-cols-2 gap-8 w-full max-w-2xl mx-auto mt-4">
                            <button onClick={() => { playSound('click'); setView('student-join'); }} className="group flex flex-col items-center justify-center bg-gradient-to-b from-blue-500 to-blue-700 text-white p-8 rounded-[2.5rem] shadow-[0_10px_0_rgb(30,58,138)] hover:-translate-y-2 transition-all border-4 border-cyan-300 relative overflow-hidden">
                                <div className="bg-blue-900/50 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-rocket text-4xl text-cyan-300"></i></div>
                                <h2 className="text-3xl font-black mb-1">MULAI MAIN</h2>
                                <p className="text-sm font-bold text-cyan-200">Masuk sebagai Siswa</p>
                            </button>

                            <button onClick={() => { playSound('click'); setView('login'); }} className="group flex flex-col items-center justify-center bg-gradient-to-b from-purple-500 to-purple-700 text-white p-8 rounded-[2.5rem] shadow-[0_10px_0_rgb(88,28,135)] hover:-translate-y-2 transition-all border-4 border-purple-300">
                                <div className="bg-purple-900/50 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-gear text-4xl text-purple-300"></i></div>
                                <h2 className="text-3xl font-black mb-1">GURU</h2>
                                <p className="text-sm font-bold text-purple-200">Buat Game Baru</p>
                            </button>
                        </div>
                    </div>

                    {/* --- KREDIT PENGEMBANG --- */}
                    <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 text-cyan-100/90 font-bold text-xs md:text-sm tracking-widest uppercase z-20 bg-blue-900/40 px-6 py-2 rounded-full backdrop-blur-md border border-cyan-400/30 drop-shadow-lg">
                        Pengembang: <span className="text-yellow-300">fyna_wahidah</span>
                    </div>
                </div>
            );
        }

        function TeacherLogin({ onLogin, setView }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
                    <div className="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl">
                        <button onClick={() => setView('landing')} className="text-slate-400 hover:text-indigo-600 mb-6 flex items-center gap-2 text-sm font-semibold transition-colors"><i className="fa-solid fa-arrow-left"></i> Kembali</button>
                        <div className="flex items-center gap-4 mb-8">
                            <div className="bg-indigo-100 p-4 rounded-2xl rotate-[-5deg]"><i className="fa-solid fa-key text-indigo-600 text-3xl"></i></div>
                            <h2 className="text-4xl font-black text-slate-800 tracking-tight">Login Guru</h2>
                        </div>
                        <div className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-slate-600 mb-2">Email</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Masukkan email Anda" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-600 mb-2">Password</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Masukkan password" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium" />
                            </div>
                            <button onClick={() => onLogin(email, password)} className="w-full bg-indigo-600 text-white font-black text-lg py-4 rounded-xl hover:bg-indigo-700 hover:-translate-y-1 transition-all shadow-[0_6px_0_rgb(67,56,202)] mt-4">Masuk ke Dashboard</button>
                            <div className="text-center mt-6">
                                <span className="text-slate-500 font-medium text-sm">Belum punya akun? </span>
                                <button onClick={() => setView('register')} className="text-indigo-600 font-bold hover:underline">Daftar Sekarang</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function TeacherRegister({ onRegister, setView }) {
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
                    <div className="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl border-t-8 border-indigo-500">
                        <div className="flex items-center gap-3 mb-8">
                            <div className="bg-indigo-100 p-3 rounded-xl"><i className="fa-solid fa-users text-indigo-600 text-2xl"></i></div>
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">Daftar Akun Baru</h2>
                        </div>
                        <div className="space-y-4">
                            <div><label className="block text-sm font-bold text-slate-600 mb-1">Nama Lengkap & Gelar</label><input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Misal: Budi Santoso, S.Pd" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                            <div><label className="block text-sm font-bold text-slate-600 mb-1">Email</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="guru@sekolah.com" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                            <div><label className="block text-sm font-bold text-slate-600 mb-1">Password</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Buat password" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                            <button onClick={() => onRegister(name, email, password)} className="w-full bg-green-500 text-white font-black text-lg py-4 rounded-xl hover:bg-green-600 hover:-translate-y-1 transition-all shadow-[0_6px_0_rgb(22,101,52)] mt-6">Buat Akun Guru</button>
                            <div className="text-center mt-6">
                                <span className="text-slate-500 font-medium text-sm">Sudah punya akun? </span>
                                <button onClick={() => setView('login')} className="text-indigo-600 font-bold hover:underline">Masuk di sini</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function TeacherDashboard({ db, user, setView, setActiveGame }) {
            const myGames = db.games.filter(g => g.teacherId === user.id);
            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-white border-b-4 border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-green-400 to-emerald-600 p-2 rounded-xl shadow-md rotate-3 text-white">
                                <i className="fa-solid fa-wand-magic-sparkles text-2xl"></i>
                            </div>
                            <h1 className="text-3xl font-black text-slate-800">EDU<span className="text-green-500">GROW</span></h1>
                        </div>
                        <div className="flex items-center gap-6">
                            <span className="font-medium text-slate-600 hidden md:block">Halo, {user.name}</span>
                            <button onClick={() => setView('landing')} className="text-red-500 font-semibold hover:bg-red-50 p-2 rounded-lg flex items-center gap-2"><i className="fa-solid fa-right-from-bracket"></i> Keluar</button>
                        </div>
                    </header>
                    
                    <main className="max-w-6xl mx-auto p-6 mt-8">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                            <div>
                                <h2 className="text-4xl font-black text-slate-800 tracking-tight">Koleksi Misi</h2>
                                <p className="text-green-600 font-bold mt-2 bg-green-100 px-3 py-1.5 rounded-lg w-fit text-sm flex items-center gap-2"><i className="fa-solid fa-shield-halved"></i> Privat: Hanya Anda yang dapat melihat data siswa Anda.</p>
                            </div>
                            <button onClick={() => setView('create-game')} className="bg-green-500 text-white px-6 py-4 rounded-2xl font-black flex items-center gap-3 hover:bg-green-600 transition-all shadow-[0_6px_0_rgb(21,128,61)] active:scale-95"><i className="fa-solid fa-circle-plus text-xl"></i> BUAT MISI BARU</button>
                        </div>

                        {myGames.length === 0 ? (
                            <div className="text-center py-20 bg-white rounded-[3rem] border-4 border-dashed border-slate-200 shadow-sm">
                                <div className="w-24 h-24 bg-slate-100 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i className="fa-solid fa-rocket text-5xl"></i>
                                </div>
                                <h3 className="text-2xl font-black text-slate-600 mb-2">Belum Ada Misi!</h3>
                                <p className="text-slate-400 font-medium">Mulai buat permainan interaktif pertama Anda.</p>
                            </div>
                        ) : (
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {myGames.map(game => {
                                    const gameResults = db.results.filter(r => r.gameId === game.id);
                                    return (
                                        <div key={game.id} className="bg-white rounded-[2rem] p-6 shadow-md border-2 border-slate-100 hover:border-indigo-300 hover:shadow-2xl transition-all group hover:-translate-y-2 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-bl-full -z-10 group-hover:bg-indigo-100 transition-colors"></div>
                                            <span className="bg-indigo-100 text-indigo-700 text-xs font-black px-4 py-1.5 rounded-full uppercase tracking-widest">{game.subject}</span>
                                            <h3 className="text-xl font-bold mt-4 mb-2 line-clamp-2">{game.title}</h3>
                                            <div className="flex items-center gap-4 text-sm text-slate-500 mb-6">
                                                <div className="flex items-center gap-1"><i className="fa-solid fa-book-open"></i> {game.questions.length} Soal</div>
                                                <div className="flex items-center gap-1"><i className="fa-solid fa-users"></i> {gameResults.length} Peserta</div>
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-xl mb-6 border border-slate-100">
                                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Kode Join:</p>
                                                <div className="text-2xl font-black text-blue-600 tracking-widest">{game.code}</div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={() => { setActiveGame(game); setView('teacher-results'); }} className="bg-slate-100 hover:bg-slate-200 py-3 rounded-xl font-semibold flex justify-center items-center gap-2 transition-colors"><i className="fa-solid fa-chart-column"></i> Hasil</button>
                                                <button onClick={() => { setActiveGame({...game, playMode: 'onedevice'}); setView('student-join'); }} className="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 py-3 rounded-xl font-bold flex justify-center items-center gap-2 transition-colors"><i className="fa-solid fa-desktop"></i> 1-Device</button>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        function CreateGame({ onSave, setView, showToast }) {
            const [title, setTitle] = useState('');
            const [subject, setSubject] = useState('');
            const [grade, setGrade] = useState('');
            const [questions, setQuestions] = useState([]);
            const [showAIModal, setShowAIModal] = useState(false);
            const [showImportModal, setShowImportModal] = useState(false);
            
            const addManual = () => setQuestions([...questions, { id: `q${Date.now()}`, type: 'mcq', text: '', options: ['','','',''], correctAnswer: '', points: 10 }]);
            
            const updateQ = (i, f, v, oIdx = null) => {
                const nq = [...questions];
                if(oIdx !== null) nq[i].options[oIdx] = v; else nq[i][f] = v;
                setQuestions(nq);
            };

            const handleSave = () => {
                if(!title || !subject || questions.length===0) return showToast("Lengkapi data dan minimal 1 soal!");
                const valid = questions.every(q => q.text && q.correctAnswer && q.options.every(o => o));
                if (!valid) return showToast("Pastikan semua soal memiliki teks, pilihan, dan kunci jawaban.");
                onSave({ title, subject, grade, questions });
            };

            return (
                <div className="min-h-screen bg-slate-100 pb-20">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setView('teacher-dash')} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-circle-xmark text-3xl"></i></button>
                            <h2 className="text-2xl font-bold text-slate-800">Buat Game Baru</h2>
                        </div>
                        <button onClick={handleSave} className="bg-green-500 text-white px-8 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg hover:-translate-y-1 transition-all"><i className="fa-solid fa-check"></i> Terbitkan Game</button>
                    </header>

        function ImportModal({ onClose, onApply }) {
            const [jsonText, setJsonText] = useState('');
            const [error, setError] = useState('');

            const copyPrompt = () => {
                const prompt = `Buat 5 soal pilihan ganda berbahasa Indonesia. Output HARUS array JSON murni tanpa format markdown (tanpa \`\`\`json). WAJIB gunakan struktur key ini persis: "text", "options", "correctAnswer", "points".\nPENTING: Isi "correctAnswer" HARUS SAMA PERSIS dengan salah satu teks di dalam "options", BUKAN huruf A/B/C/D.\nContoh: [{"text": "Siapa penemu lampu?", "options": ["Edison", "Tesla", "Newton", "Einstein"], "correctAnswer": "Edison", "points": 10}]`;
                navigator.clipboard.writeText(prompt);
                showToast && alert("Prompt berhasil disalin! Silakan paste di Gemini.");
            };

            const handleImport = () => {
                try {
                    setError('');
                    if(!jsonText.trim()) throw new Error("Teks masih kosong!");
                    
                    let cleanText = jsonText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(cleanText);
                    
                    if (!Array.isArray(parsed)) throw new Error("Format salah. Harus diawali dengan tanda kurung siku [ dan diakhiri dengan ].");
                    
                    const mappedQs = parsed.map((q, idx) => {
                        let ans = q.correctAnswer || "";
                        // Deteksi otomatis jika AI bandel mengembalikan "A", "B", "C", atau "D"
                        if (ans.trim().match(/^[A-D]$/i) && q.options) {
                            const optIndex = ans.trim().toUpperCase().charCodeAt(0) - 65;
                            if (q.options[optIndex]) ans = q.options[optIndex];
                        }
                        
                        return {
                            id: `q_imp_${Date.now()}_${idx}`,
                            type: 'mcq',
                            text: q.text || q.pertanyaan || q.question || 'Soal tidak valid (AI mengubah format)',
                            options: q.options || q.pilihan || q.jawaban || ["", "", "", ""],
                            correctAnswer: ans,
                            points: q.points || q.bobot || 10
                        };
                    });
                    
                    onApply(mappedQs);
                } catch (err) {
                    setError('Gagal membaca format JSON: ' + err.message);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-200">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-2xl font-bold text-emerald-700 flex items-center gap-2"><i className="fa-solid fa-paste"></i> Paste Soal AI</h3>

                        </div>
                        <div className="bg-emerald-50 text-emerald-800 text-sm p-4 rounded-xl mb-4 border border-emerald-100 leading-relaxed">
                            Buka <b>Gemini / ChatGPT</b> di HP atau Tab baru. Gunakan prompt di bawah ini, lalu <b>Copy-Paste balasan AI</b> ke dalam kotak teks di bawah.
                        </div>
                        
                        <button onClick={copyPrompt} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 p-3 rounded-xl font-bold flex justify-center items-center gap-2 mb-4 border border-slate-300 transition-colors">
                            <i className="fa-solid fa-copy"></i> Salin Prompt (Perintah) untuk AI
                        </button>

                        <div className="mb-4">
                            <label className="block text-sm font-bold text-slate-600 mb-1">Paste Balasan AI (Format JSON)</label>
                            <textarea 
                                value={jsonText} onChange={e => setJsonText(e.target.value)} 
                                placeholder='[{"text": "Soal...", "options": ["A","B","C","D"], "correctAnswer": "A", "points": 10}]'
                                className="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none h-40 font-mono text-sm"
                            ></textarea>
                        </div>

                        {error && <div className="text-red-600 text-sm font-semibold mb-4 bg-red-50 p-3 rounded-lg"><i className="fa-solid fa-triangle-exclamation mr-2"></i> {error}</div>}
                        
                        <button onClick={handleImport} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-emerald-600/30">
                            Masukkan Soal ke Game
                        </button>
                    </div>
                </div>
            );
        }

        function AIGeneratorModal({ onClose, onApply, context }) {
            const [topic, setTopic] = useState('');
            const [count, setCount] = useState(3);
            const [apiKey, setApiKey] = useState(localStorage.getItem('geminiApiKey') || '');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const generateWithAI = async () => {
                if (!topic) return setError('Topik materi harus diisi.');
                if (!apiKey) return setError('API Key diperlukan. Dapatkan gratis di aistudio.google.com');
                
                // Simpan otomatis ke browser agar guru tidak perlu ketik ulang
                localStorage.setItem('geminiApiKey', apiKey);
                
                setLoading(true);
                setError('');

                const prompt = `Buat ${count} soal pilihan ganda berbahasa Indonesia untuk mata pelajaran ${context.subject || 'Umum'}, level ${context.grade || 'Sekolah'}. Topik: ${topic}.
                Output HARUS berupa array JSON murni tanpa markdown. WAJIB gunakan struktur key ini persis: "text", "options", "correctAnswer", "points".
                PENTING: Isi "correctAnswer" HARUS SAMA PERSIS dengan salah satu teks di dalam "options", BUKAN huruf A/B/C/D.
                Contoh: [{"text": "Berapa 1+1?", "options": ["1", "2", "3", "4"], "correctAnswer": "2", "points": 10}]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    if (!response.ok) throw new Error("Gagal menghubungi AI. Pastikan API Key Anda benar.");
                    const data = await response.json();
                    
                    let jsonText = data.candidates[0].content.parts[0].text;
                    jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const generatedQs = JSON.parse(jsonText);
                    
                    const mappedQs = generatedQs.map((q, idx) => {
                        let ans = q.correctAnswer || "";
                        // Deteksi otomatis jika AI bandel mengembalikan "A", "B", "C", atau "D"
                        if (ans.trim().match(/^[A-D]$/i) && q.options) {
                            const optIndex = ans.trim().toUpperCase().charCodeAt(0) - 65;
                            if (q.options[optIndex]) ans = q.options[optIndex];
                        }

                        return {
                            id: `q_ai_${Date.now()}_${idx}`,
                            type: 'mcq',
                            text: q.text || q.pertanyaan || q.question || 'Soal tidak valid',
                            options: q.options || q.pilihan || ["", "", "", ""],
                            correctAnswer: ans,
                            points: q.points || 10
                        };
                    });
                    
                    onApply(mappedQs);
                } catch (err) {
                    setError('Terjadi kesalahan format atau API Key: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-200">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-2xl font-bold text-indigo-700 flex items-center gap-2"><i className="fa-solid fa-brain"></i> AI Generator</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-2xl"><i className="fa-solid fa-circle-xmark"></i></button>
                        </div>
                        <div className="bg-indigo-50 text-indigo-800 text-sm p-4 rounded-xl mb-6 border border-indigo-100 leading-relaxed">
                            Karena game di-hosting secara mandiri (GitHub/Google Sites), Anda wajib memasukkan <b>API Key Gemini (Gratis)</b> milik Anda. <b>Sistem akan menyimpannya otomatis</b> di browser ini sehingga Anda cukup memasukkannya 1 kali saja!
                        </div>
                        <div className="space-y-4 mb-6">
                            <div>
                                <label className="block text-sm font-bold text-slate-600 mb-1">API Key Gemini <a href="https://aistudio.google.com/" target="_blank" className="text-blue-500 underline ml-2 font-normal">(Ambil di sini)</a></label>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Masukkan API Key..." className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-600 mb-1">Topik/Materi Pembelajaran</label>
                                <textarea value={topic} onChange={e => setTopic(e.target.value)} placeholder="Misal: Perang Diponegoro" className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none h-24"></textarea>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-600 mb-1">Jumlah Soal</label>
                                <input type="number" min="1" max="10" value={count} onChange={e => setCount(parseInt(e.target.value))} className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                        </div>
                        {error && <div className="text-red-600 text-sm font-semibold mb-4 bg-red-50 p-3 rounded-lg"><i className="fa-solid fa-triangle-exclamation mr-2"></i> {error}</div>}
                        <button onClick={generateWithAI} disabled={loading} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all disabled:opacity-70 shadow-lg shadow-indigo-600/30">
                            {loading ? 'Sedang Meracik Soal...' : 'Generate Soal Sekarang'}
                        </button>
                    </div>
                </div>
            );
        }

                    <main className="flex-1 w-full mx-auto flex flex-col justify-center max-w-4xl z-10 relative">
                        <div className="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-[0_15px_40px_rgba(0,0,0,0.2)] p-8 md:p-12 mb-8 border-8 border-amber-300 relative text-center">
                            <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-gradient-to-r from-amber-400 to-orange-500 text-white font-black text-lg px-8 py-2 rounded-full border-4 border-white shadow-lg flex items-center gap-2"><i className="fa-solid fa-location-dot"></i> TANTANGAN</div>
                            <h2 className="text-2xl md:text-4xl font-black text-slate-800 leading-relaxed mt-4 drop-shadow-sm">{q.text}</h2>
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-4 md:gap-6 px-2">
                            {q.options.map((opt, idx) => {
                                if(!opt) return null;
                                const isSelected = selectedOption === opt;
                                return (
                                    <button key={idx} onClick={() => { playSound('select'); setSelectedOption(opt); }} className={`w-full text-left p-5 md:p-8 rounded-[2rem] transition-all font-black text-xl flex items-center gap-4 border-4 relative overflow-hidden ${optionStyles[idx%4]} ${isSelected ? 'scale-95 opacity-80 ring-8 ring-white/50' : 'hover:-translate-y-2'} active:scale-95`}>
                                        <div className="absolute top-0 left-0 right-0 h-1/3 bg-white/20 rounded-t-[1.5rem]"></div>
                                        <div className="w-12 h-12 rounded-2xl bg-black/20 flex items-center justify-center text-3xl z-10 shrink-0">{['A','B','C','D'][idx]}</div>
                                        <span className="drop-shadow-md z-10">{opt}</span>
                                        {isSelected && <div className="ml-auto bg-white text-slate-900 rounded-full p-1 z-10"><i className="fa-solid fa-circle-check text-3xl text-green-500"></i></div>}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="mt-10 flex justify-center pb-8">
                            <button onClick={handleNext} disabled={!selectedOption} className="w-full max-w-md bg-gradient-to-b from-yellow-300 to-yellow-500 text-yellow-900 text-2xl font-black py-5 rounded-[2.5rem] disabled:opacity-50 hover:brightness-110 transition-all shadow-[0_10px_0_rgb(161,98,7)] disabled:shadow-none hover:translate-y-1 active:translate-y-2 border-4 border-yellow-100 flex justify-center items-center gap-3">
                                {isLast ? 'MASUK PORTAL AKHIR!' : 'LANJUT JELAJAH'} <i className="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </main>
                </div>
            );
        }

        function StudentComplete({ setView, gameMode }) {
            useEffect(() => { playSound('complete'); }, []);
            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-b from-sky-400 to-emerald-500 p-6 text-center relative overflow-hidden">
                    <div className="absolute top-10 left-10 text-yellow-300 animate-bounce text-6xl"><i className="fa-solid fa-star"></i></div>
                    <div className="absolute top-20 right-20 text-white opacity-80 animate-pulse text-8xl"><i className="fa-solid fa-cloud"></i></div>
                    
                    <div className="bg-white p-12 rounded-[3rem] shadow-2xl max-w-xl w-full border-8 border-amber-200 relative z-10">
                        <div className="w-32 h-32 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner border-4 border-amber-50 rotate-[-5deg]"><i className="fa-solid fa-flag text-6xl"></i></div>
                        <h2 className="text-4xl md:text-5xl font-black text-slate-800 mb-6 tracking-tight drop-shadow-sm">BERPETUALANGAN SELESAI! 🎉</h2>
                        <div className="bg-amber-50 p-6 rounded-3xl border-2 border-amber-100 mb-8 shadow-inner">
                            <p className="text-amber-900 text-xl font-bold leading-relaxed">Luar Biasa! Jejak penjelajahanmu sudah terekam.</p>
                            <p className="text-amber-700 mt-2 font-medium">Beri tahu Guru bahwa kamu telah menemukan ujung peta ini!</p>
                        </div>
                        <button onClick={() => setView(gameMode === 'onedevice' ? 'student-join' : 'landing')} className={`w-full font-black text-xl py-6 rounded-3xl transition-all border-2 ${gameMode==='onedevice' ? 'bg-yellow-400 text-yellow-900 shadow-[0_8px_0_rgb(180,83,9)] border-yellow-300' : 'bg-slate-800 text-white shadow-[0_8px_0_rgb(15,23,42)] border-slate-700'} hover:translate-y-1 active:scale-95`}>
                            {gameMode === 'onedevice' ? 'Siswa Berikutnya ➡️' : '🏠 KEMBALI KE BERANDA'}
                        </button>
                    </div>
                </div>
            );
        }

        function TeacherResults({ db, game, user, setView, showToast }) {
            const results = db.results.filter(r => r.gameId === game.id && r.teacherId === user.id);
            const averageScore = results.length > 0 ? Math.round(results.reduce((acc, curr) => acc + curr.score, 0) / results.length) : 0;
            
            const exportCSV = () => {
                if (results.length === 0) {
                    return showToast("Belum ada data siswa untuk diekspor!");
                }
                const csvString = "\ufeff" + ['Nama,Kelas,Benar,Salah,Nilai'].concat(results.map(r => `"${r.studentName}","${r.studentClass}",${r.totalCorrect},${r.totalQuestions-r.totalCorrect},${r.score}`)).join('\n');
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([csvString], { type: 'text/csv;charset=utf-8;' }));
                link.download = `Hasil_${game.title}.csv`;
                link.click();
            };

            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-sm">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setView('teacher-dash')} className="text-slate-400 hover:bg-slate-100 p-2 rounded-full text-2xl"><i className="fa-solid fa-circle-xmark"></i></button>
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">Laporan Hasil Evaluasi</h2>
                                <div className="flex items-center gap-2 mt-1"><i className="fa-solid fa-shield-halved text-green-600"></i><p className="text-sm font-bold text-green-600">{game.title} • Akses Privat</p></div>
                            </div>
                        </div>
                        <button onClick={exportCSV} className="bg-green-100 hover:bg-green-200 text-green-700 px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors"><i className="fa-solid fa-download"></i> Ekspor Data (CSV)</button>
                    </header>
                    <main className="max-w-6xl mx-auto p-6 mt-4">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-3xl"><i className="fa-solid fa-users"></i></div>
                                <div><p className="text-sm font-bold text-slate-400 uppercase">Total Peserta</p><p className="text-3xl font-black text-slate-800">{results.length}</p></div>
                            </div>
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-2xl flex items-center justify-center text-3xl"><i className="fa-solid fa-chart-column"></i></div>
                                <div><p className="text-sm font-bold text-slate-400 uppercase">Rata-rata</p><p className="text-3xl font-black text-slate-800">{averageScore}</p></div>
                            </div>
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-3xl"><i className="fa-solid fa-book-open"></i></div>
                                <div><p className="text-sm font-bold text-slate-400 uppercase">Total Soal</p><p className="text-3xl font-black text-slate-800">{game.questions.length}</p></div>
                            </div>
                        </div>
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                                <h3 className="text-lg font-bold text-slate-800">Daftar Nilai Siswa</h3>
                                <div className="relative">
                                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                    <input type="text" placeholder="Cari siswa..." className="pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl outline-none focus:border-blue-400 text-sm font-medium w-64" />
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="bg-slate-50 text-slate-500 text-sm uppercase tracking-wider font-bold"><th className="p-4 border-b">Nama Siswa</th><th className="p-4 border-b">Kelas</th><th className="p-4 border-b">Benar</th><th className="p-4 border-b">Salah</th><th className="p-4 border-b">Nilai Akhir</th><th className="p-4 border-b">Waktu</th></tr></thead>
                                    <tbody className="text-slate-700 font-medium">
                                        {results.sort((a,b) => b.score - a.score).map((r) => (
                                            <tr key={r.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                <td className="p-4 font-bold text-slate-800">{r.studentName}</td>
                                                <td className="p-4 text-slate-500">{r.studentClass}</td>
                                                <td className="p-4 text-green-600">{r.totalCorrect}</td>
                                                <td className="p-4 text-red-500">{r.totalQuestions - r.totalCorrect}</td>
                                                <td className="p-4"><span className={`inline-block px-3 py-1 rounded-lg font-black ${r.score >= 70 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{r.score}</span></td>
                                                <td className="p-4 text-xs text-slate-400">{new Date(r.timestamp).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduGameApp />);
    </script>
</body>
</html>
